<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUSFS - Credits</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <script type="importmap">
      {
        "imports": {
          "@material/web/": "https://esm.run/@material/web/"
        }
      }
    </script>
    <script type="module">
      import '@material/web/all.js';
      import {styles as typescaleStyles} from '@material/web/typography/md-typescale-styles.js';
      document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>

    <script type="module" crossorigin src="/assets/fade-4ApaDT9x.js"></script>
    <script type="module" crossorigin src="/assets/creditsjs-BfjoyHvA.js"></script>
    <script type="module" crossorigin src="/assets/i18n-CuIujUHf.js"></script>
    <script type="module" crossorigin src="/assets/index-DzwXTQ4A.js"></script>

    <style>
        /* --- TEMA MATERIAL 3 --- */
        :root {
            --md-sys-color-background: #111318;
            --md-sys-color-on-background: #e2e2e9;
            --md-sys-color-surface: #111318;
            --md-sys-color-surface-container: #1d2024;
            --md-sys-color-surface-container-high: #282a2f;
            --md-sys-color-primary: #a8c7fa;
            --md-sys-color-secondary: #bec6dc;
            --md-sys-color-tertiary: #dcaeeb;
            
            --font-body: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            font-family: var(--font-body);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        main {
            width: 100%;
            max-width: 800px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            align-items: center;
            padding-bottom: 80px;
        }

        /* --- DEVELOPER CARDS GRID --- */
        .dev-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            width: 100%;
        }
        @media (min-width: 600px) {
            .dev-grid { grid-template-columns: 1fr 1fr; }
        }

        .profile-card {
            background-color: var(--md-sys-color-surface-container);
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .profile-card:hover {
            transform: translateY(-2px);
            background-color: var(--md-sys-color-surface-container-high);
        }

        .avatar {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border-radius: 50%; /* Membuat gambar bulat jika rasio aspek 1:1, atau tetap kotak jika transparan */
            margin-bottom: 16px;
            background-color: rgba(255,255,255,0.05);
            padding: 10px;
        }

        .dev-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--md-sys-color-primary);
            margin: 0;
        }
        .dev-role {
            font-size: 0.9rem;
            color: var(--md-sys-color-secondary);
            margin-top: 4px;
            margin-bottom: 16px;
        }

        /* --- CONTRIBUTORS & TRANSLATORS SECTIONS --- */
        .section-title {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 12px;
            align-self: flex-start;
            color: var(--md-sys-color-on-background);
            border-left: 4px solid var(--md-sys-color-primary);
            padding-left: 12px;
        }

        /* Horizontal Scroll Container */
        .scroll-container {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            width: 100%;
            padding-bottom: 12px;
            /* Scrollbar styling for Webkit */
            scrollbar-width: thin;
            scrollbar-color: var(--md-sys-color-secondary) transparent;
        }
        .scroll-container::-webkit-scrollbar { height: 6px; }
        .scroll-container::-webkit-scrollbar-thumb { background-color: var(--md-sys-color-secondary); border-radius: 4px; }

        /* Style untuk item yang di-inject JS (biasanya avatar kecil) */
        .scroll-container img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--md-sys-color-surface-container-high);
            transition: transform 0.2s;
        }
        .scroll-container img:hover { transform: scale(1.1); }

        /* --- SOCIAL ICONS --- */
        /* SVG Fix untuk MD3 Icon Button */
        md-icon-button svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>

<body data-router-wrapper>
    <main data-router-view="credits">
        
        <h1 style="font-size: 2.5rem; font-weight: 300; margin-top: 20px; color: var(--md-sys-color-primary);">CREDITS</h1>

        <div class="dev-grid">
            
            <div class="profile-card">
                <img src="/assets/red-DsgSinuJ.png" class="avatar" alt="Simon Punk"/>
                <h3 class="dev-name">Simon Punk</h3>
                <p class="dev-role">susfs4ksu Developer</p>
                
                <md-icon-button onclick="ksu.exec(`am start -a android.intent.action.VIEW -d https://gitlab.com/simonpunk/susfs4ksu`)" title="GitLab">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M20.7 10.12l-2.45-6.64a.43.43 0 0 0-.82 0l-1.65 5.26H8.65L7 3.48a.43.43 0 0 0-.82 0L3.73 10.12a.43.43 0 0 0 .12.46l8.15 6.31 8.15-6.31a.43.43 0 0 0 .12-.46z"/>
                    </svg>
                </md-icon-button>
            </div>

            <div class="profile-card">
                <img src="/assets/black-CWwxUpmx.png" class="avatar" alt="sidex15"/>
                <h3 class="dev-name">sidex15</h3>
                <p class="dev-role">Module/WebUI Developer</p>

                <md-icon-button onclick="ksu.exec(`am start -a android.intent.action.VIEW -d https://github.com/sidex15`)" title="GitHub">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02a9.68 9.68 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/>
                    </svg>
                </md-icon-button>
            </div>
        </div>

        <div class="w-full" style="margin-top: 16px;">
            <div class="section-title" data-i18n="contrib_label">Contributors</div>
            <div id="contributors-container" class="scroll-container">
                </div>
        </div>

        <div class="w-full">
            <div class="section-title" data-i18n="translators_label">Translators</div>
            <div id="translators-container" class="scroll-container">
                </div>
        </div>

        <a href="index.html" style="text-decoration: none; margin-top: 16px;">
            <md-outlined-button>
                <md-icon slot="icon">arrow_back</md-icon>
                <span data-i18n="main_menu_label">Back to main menu</span>
            </md-outlined-button>
        </a>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
             if(window.i18n) window.i18n.init();
        });
    </script>
</body>
</html>
